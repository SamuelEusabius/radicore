{% extends "base.html" %}

{% block title %}Log Staff Movement{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

    <nav class="text-xs text-gray-500 mb-4">
        <a href="{% url 'dpa_admin_dashboard' %}" class="hover:text-indigo-600">DPA Dashboard</a>
        <span class="mx-2">/</span>
        <a href="{% url 'dpa_staff_movement' %}" class="hover:text-indigo-600">Movement</a>
        <span class="mx-2">/</span>
        <span class="text-gray-700">New</span>
    </nav>

    <div class="bg-white rounded-xl border border-gray-200 p-6 sm:p-8">
        <h1 class="text-2xl font-bold text-gray-900 mb-6">Log Staff Movement</h1>

        {% if messages %}
            {% for msg in messages %}
            <div class="mb-4 rounded-lg px-4 py-3 text-sm bg-red-50 text-red-800 border border-red-200">
                {{ msg }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-5">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Staff <span class="text-red-500">*</span></label>
                <select name="staff_id" required
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                    <option value="">— Select staff —</option>
                    {% for s in staff_list %}
                    <option value="{{ s.id }}">{{ s.get_full_name|default:s.email }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Direction <span class="text-red-500">*</span></label>
                <div class="flex gap-2">
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="direction" value="out" class="peer sr-only" checked>
                        <div class="px-4 py-2 text-sm text-center border border-gray-300 rounded-lg peer-checked:bg-amber-600 peer-checked:text-white peer-checked:border-amber-600">Out</div>
                    </label>
                    <label class="flex-1 cursor-pointer">
                        <input type="radio" name="direction" value="in" class="peer sr-only">
                        <div class="px-4 py-2 text-sm text-center border border-gray-300 rounded-lg peer-checked:bg-green-600 peer-checked:text-white peer-checked:border-green-600">In</div>
                    </label>
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
                <textarea name="reason" rows="2" placeholder="e.g. Medical appointment"
                          class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Expected Return Time</label>
                <input type="time" name="expected_return"
                       class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                <a href="{% url 'dpa_staff_movement' %}"
                   class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50">
                    Cancel
                </a>
                <button type="submit"
                        class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 rounded-lg hover:bg-indigo-700">
                    Log Movement
                </button>
            </div>
        </form>
    </div>

</div>
{% endblock %}
