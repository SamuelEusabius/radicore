{% extends 'base.html' %}
{% block title %}Dismiss Alert{% endblock %}
{% block header_title %}Dismiss Alert{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8">

  <h2 class="text-xl font-bold text-gray-800 mb-2">{{ alert.title }}</h2>
  <p class="text-sm text-gray-600 mb-6">
    Dismissing means you've reviewed it and decided no action is needed.
  </p>

  <form method="post">
    {% csrf_token %}

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Reason (optional)</label>
      <textarea name="notes" rows="3"
                placeholder="Why are you dismissing this alert?"
                class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div class="flex gap-3">
      <button type="submit" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold px-6 py-3 rounded-lg">
        Dismiss
      </button>
      <a href="{% url 'alerts_dashboard' %}" class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-6 py-3 rounded-lg">
        Cancel
      </a>
    </div>

  </form>

</div>

{% endblock %}
