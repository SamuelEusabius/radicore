{% extends 'base.html' %}
{% block title %}Log Fuel{% endblock %}
{% block header_title %}Log Fuel Record{% endblock %}

{% block content %}
<style>
    .form-card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        border: 1px solid #e2e8f0;
        padding: 32px;
        max-width: 800px;
        margin: 0 auto;
    }
    .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 8px;
        display: block;
    }
    .form-label .req { color: #ef4444; }
    .form-input {
        width: 100%;
        padding: 12px 14px;
        border: 2px solid #cbd5e1;
        border-radius: 8px;
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        color: #0f172a;
        background: white;
        transition: all 0.2s;
        box-sizing: border-box;
    }
    .form-input:focus {
        border-color: #10b981;
        outline: none;
        box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
</style>

<div class="form-card">
    <div style="margin-bottom: 24px; border-bottom: 1px solid #e2e8f0; padding-bottom: 16px;">
        <h3 style="margin: 0; font-size: 18px; font-weight: 700; color: #0B1B3D;">Fuel Details</h3>
        <p style="margin: 4px 0 0 0; font-size: 14px; color: #64748b;">Record the fuel purchased for your assigned vehicle.</p>
    </div>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label class="form-label">Vehicle <span class="req">*</span></label>
            <select name="vehicle" required class="form-input">
                <option value="">— Select vehicle —</option>
                {% for v in vehicles %}
                    <option value="{{ v.id }}">{{ v.make }} {{ v.model }} ({{ v.plate_number }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="grid-2">
            <div>
                <label class="form-label">Date <span class="req">*</span></label>
                <input type="date" name="date" required class="form-input" value="{{ today|date:'Y-m-d' }}">
            </div>
            <div>
                <label class="form-label">Amount (KES) <span class="req">*</span></label>
                <input type="number" step="0.01" name="amount_kes" required class="form-input" placeholder="e.g. 5000">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label class="form-label">Litres</label>
                <input type="number" step="0.01" name="litres" class="form-input" placeholder="e.g. 40.5">
            </div>
            <div>
                <label class="form-label">Odometer Reading</label>
                <input type="number" name="odometer_reading" class="form-input" placeholder="e.g. 105000">
            </div>
        </div>

        <div class="grid-2">
            <div>
                <label class="form-label">Payment Method <span class="req">*</span></label>
                <select name="payment_method" required class="form-input">
                    <option value="">— Select —</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="cash">Cash</option>
                    <option value="card">Card</option>
                </select>
            </div>
            <div>
                <label class="form-label">Payment Reference</label>
                <input type="text" name="payment_reference" class="form-input" placeholder="M-Pesa code, receipt number, etc.">
            </div>
        </div>

        <div style="margin-bottom: 20px;">
            <label class="form-label">Station Name</label>
            <input type="text" name="station_name" class="form-input" placeholder="e.g. Total Westlands">
        </div>

        <div style="margin-bottom: 32px;">
            <label class="form-label">Receipt (Optional)</label>
            <input type="file" name="receipt" accept="image/*,.pdf" class="form-input" style="padding: 10px;">
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 12px; border-top: 1px solid #e2e8f0; padding-top: 24px;">
            <a href="{% url 'driver_dashboard' %}" class="btn btn-secondary" style="padding: 12px 24px;">Cancel</a>
            <button type="submit" class="btn btn-primary" style="padding: 12px 32px;">Save Fuel Log</button>
        </div>
    </form>
</div>
{% endblock %}
