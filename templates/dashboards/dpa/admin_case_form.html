{% extends "base.html" %}
{% load static %}

{% block title %}Open Admin Case{% endblock %}
{% block header_title %}Open Student Admin Case{% endblock %}

{% block content %}

<div class="card" style="max-width: 720px;">
  <form method="post">
    {% csrf_token %}

    {% if messages %}
      {% for msg in messages %}
      <div style="padding: var(--s-3); margin-bottom: var(--s-4); border-radius: 8px; background: rgba(239, 68, 68, 0.1); color: #DC2626; font-size: var(--text-sm);">{{ msg }}</div>
      {% endfor %}
    {% endif %}

    <div style="margin-bottom: var(--s-5);">
      <label style="display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--s-1);">Student <span style="color: #DC2626;">*</span></label>
      <select name="student_id" required class="select">
        <option value="">— Select student —</option>
        {% for s in students %}
        <option value="{{ s.id }}">{{ s.first_name }} {{ s.last_name }} ({{ s.class_level }} · {{ s.admission_number }})</option>
        {% endfor %}
      </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-5); margin-bottom: var(--s-5);">
      <div>
        <label style="display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--s-1);">Case Type <span style="color: #DC2626;">*</span></label>
        <select name="case_type" required class="select">
          {% for value, label in case_types %}
          <option value="{{ value }}">{{ label }}</option>
          {% endfor %}
        </select>
      </div>
      <div>
        <label style="display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--s-1);">Priority</label>
        <select name="priority" class="select">
          {% for value, label in priorities %}
          <option value="{{ value }}" {% if value == 'normal' %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div style="margin-bottom: var(--s-5);">
      <label style="display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--s-1);">Title <span style="color: #DC2626;">*</span></label>
      <input type="text" name="title" required class="input" style="width: 100%;" placeholder="Short summary of the case">
    </div>

    <div style="margin-bottom: var(--s-5);">
      <label style="display: block; font-size: var(--text-xs); font-weight: 600; color: var(--ink-600); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: var(--s-1);">Description <span style="color: #DC2626;">*</span></label>
      <textarea name="description" rows="5" required class="input" style="width: 100%;" placeholder="Full details of the situation"></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: var(--s-3); padding-top: var(--s-4); border-top: 1px solid var(--surface-3);">
      <a href="{% url 'dpa_admin_cases' %}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Open Case</button>
    </div>

  </form>
</div>

{% endblock %}
