{% extends 'base.html' %}
{% block title %}Resolve Alert{% endblock %}
{% block header_title %}✅ Resolve Alert{% endblock %}

{% block content %}

<div class="max-w-xl mx-auto bg-white rounded-xl shadow-sm border border-gray-100 p-8">

  <div class="mb-6">
    <div class="text-2xl mb-2">{{ alert.severity_icon }}</div>
    <h2 class="text-xl font-bold text-gray-800 mb-2">{{ alert.title }}</h2>
    <p class="text-sm text-gray-600 mb-4">{{ alert.description }}</p>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Resolution Notes (optional)</label>
      <textarea name="notes" rows="4"
                placeholder="Describe the action you took..."
                class="w-full border border-gray-300 p-3 rounded-lg focus:ring-2 focus:ring-teal-500"></textarea>
    </div>

    <div class="flex gap-3">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-semibold px-6 py-3 rounded-lg">
        ✅ Mark as Resolved
      </button>
      <a href="{% url 'alerts_dashboard' %}" class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-6 py-3 rounded-lg">
        Cancel
      </a>
    </div>

  </form>

</div>

{% endblock %}
