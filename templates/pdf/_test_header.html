{% load static %}
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4 portrait; margin: 12mm; }
  body { font-family: 'DejaVu Sans', Arial, sans-serif; font-size: 10pt; color: #1a1a1a; }

  /* ========================================================== */
  /* STANDARD REPORT HEADER                                     */
  /* ========================================================== */
  table.report-header { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  table.report-header td { vertical-align: top; padding: 0; }
  .rh-logo-cell { width: 90px; padding-right: 16px; }
  .rh-logo-img { width: 72px; height: 72px; object-fit: contain; }
  .rh-info-cell { vertical-align: top; }
  .rh-school-name { font-size: 16pt; font-weight: bold; color: #00695c; line-height: 1.1; margin: 0; }
  .rh-motto { font-style: italic; font-size: 9.5pt; color: #555; margin-top: 3px; }
  .rh-address { font-size: 9pt; color: #555; margin-top: 6px; }
  .rh-contact { font-size: 9pt; color: #555; margin-top: 2px; }
  .rh-meta-cell { width: 150px; text-align: right; vertical-align: top; padding-right: 4px; }
  .rh-meta-label { font-size: 6.5pt; text-transform: uppercase; letter-spacing: 0.05em; color: #888; font-weight: bold; }
  .rh-meta-date { font-size: 10pt; font-weight: bold; color: #1a1a1a; margin-top: 1px; }
  .rh-meta-time { font-size: 8.5pt; color: #555; margin-top: 1px; }
  .rh-meta-name { font-size: 8.5pt; color: #555; margin-top: 1px; }
  .rh-divider { border-bottom: 2pt solid #00695c; margin-bottom: 14px; }
</style>
</head>
<body>

{% include 'pdf/_report_header.html' %}

<h1 style="text-align: center; color: #00695c;">TEST HEADER</h1>
<p>If you can see the school logo, name, motto, address, and contact — the header works.</p>

</body>
</html>
