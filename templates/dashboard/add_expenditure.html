{% extends 'base.html' %}
{% block title %}Add Expenditure{% endblock %}
{% block header_title %}Add Expenditure{% endblock %}
{% block header_sub %}Record a school expense{% endblock %}

{% block content %}

<div class="max-w-2xl mx-auto">
  <form method="post" class="bg-white shadow-sm border border-gray-200 p-8 space-y-5" style="border-radius: 0;">
    {% csrf_token %}

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
      <select name="category" required class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;">
        <option value="">— Select category —</option>
        {% for value, label in categories %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
      <input type="text" name="description" required
             placeholder="e.g. January staff salaries"
             class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Amount (KES) <span class="text-red-500">*</span></label>
        <input type="number" name="amount_kes" step="0.01" min="1" required
               class="w-full border border-gray-300 p-3 text-sm font-semibold" style="border-radius: 0;">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Date <span class="text-red-500">*</span></label>
        <input type="date" name="spent_on" required
               class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Paid To</label>
        <input type="text" name="paid_to"
               placeholder="e.g. Staff, Vendor name"
               class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
        <select name="payment_method" class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;">
          <option value="cash">Cash</option>
          <option value="mpesa">M-Pesa</option>
          <option value="bank">Bank Transfer</option>
          <option value="cheque">Cheque</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Reference (optional)</label>
      <input type="text" name="reference"
             placeholder="e.g. M-Pesa receipt, cheque number"
             class="w-full border border-gray-300 p-3 text-sm font-mono" style="border-radius: 0;">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notes (optional)</label>
      <textarea name="notes" rows="3"
                class="w-full border border-gray-300 p-3 text-sm" style="border-radius: 0;"></textarea>
    </div>

    <div class="flex gap-3 pt-4">
      <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold px-6 py-3 text-sm" style="border-radius: 0;">
        Save Expenditure
      </button>
      <a href="{% url 'accountant_transactions' %}" class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium px-6 py-3 text-sm" style="border-radius: 0;">
        Cancel
      </a>
    </div>
  </form>
</div>

{% endblock %}
